name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Musculation.xcodeproj \
            -target Musculation \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  ipa:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild build \
            -project Musculation.xcodeproj \
            -target Musculation \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Musculation.app Payload/
          zip -qry Musculation-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Musculation-unsigned-ipa
          path: Musculation-unsigned.ipa
      # Outside pull requests, publish a release so the .ipa has a direct link:
      # https://github.com/Matthieumdb/musculation/releases/latest/download/Musculation.ipa
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp Musculation-unsigned.ipa Musculation.ipa
          gh release create "build-${{ github.run_number }}" Musculation.ipa \
            --target "${{ github.sha }}" \
            --title "Musculation (build ${{ github.run_number }})" \
            --notes "Compilée depuis ${{ github.ref_name }}. À installer avec Sideloadly ou AltStore." \
            --latest
