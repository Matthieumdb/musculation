name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Musculation.xcodeproj \
            -target Musculation \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  ipa:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild build \
            -project Musculation.xcodeproj \
            -target Musculation \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' Musculation.xcodeproj/project.pbxproj | sed -E 's/.*= *([^;]+);/\1/')
          IPA="Musculation-${VERSION}-build-${{ github.run_number }}.ipa"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          mkdir -p Payload
          cp -R build/Release-iphoneos/Musculation.app Payload/
          # Ad-hoc signature carrying the entitlements (HealthKit), so that
          # Sideloadly or AltStore keep them when they re-sign the app.
          codesign --force --sign - --entitlements Musculation.entitlements --timestamp=none Payload/Musculation.app
          codesign -d --entitlements - Payload/Musculation.app
          zip -qry "$IPA" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA }}
          path: ${{ env.IPA }}
      # Outside pull requests, publish a release with the versioned .ipa, plus a copy
      # named Musculation.ipa so this direct link always serves the latest one:
      # https://github.com/Matthieumdb/musculation/releases/latest/download/Musculation.ipa
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$IPA" Musculation.ipa
          gh release create "v${VERSION}-build-${{ github.run_number }}" "$IPA" Musculation.ipa \
            --target "${{ github.sha }}" \
            --title "Musculation ${VERSION} (build ${{ github.run_number }})" \
            --notes "Compilée depuis ${{ github.ref_name }}. À installer avec Sideloadly ou AltStore." \
            --latest
